# =============================================
# Academic Evaluation Service - Configuration
# =============================================

# Server
server.port=8083
spring.application.name=academic-evaluation-service

# H2 Database (base indépendante)
spring.datasource.url=jdbc:h2:mem:academic_evaluation_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop : crée le schéma au démarrage et le supprime à l'arrêt (idéal pour H2 en mémoire)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Garantit que Hibernate génère les tables AVANT toute initialisation de données
spring.jpa.defer-datasource-initialization=true

# Communication avec Academic Registration Service
academic.registration.service.url=http://localhost:8082

# Logging
logging.level.com.academic=DEBUG
logging.level.org.springframework.web=INFO
